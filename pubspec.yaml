name: doodledry
description: "DOODLEDRY - Smart Baby Monitoring System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Bluetooth Low Energy
  flutter_blue_plus: ^1.34.5
  
  # Charts and Visualizations
  fl_chart: ^0.68.0
  
  # Local Storage & Persistence
  shared_preferences: ^2.2.3
  
  # UI, Fonts & Animations
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
